name: CI

# Le sujet demande une chaîne de livraison continue : chaque poussée et chaque PR
# rejoue les deux suites de tests avec leurs seuils de couverture (70/70/70/50),
# qui font échouer la commande d'eux-mêmes si la couverture retombe.
on:
  push:
    branches: [main, prod, theo]
  pull_request:

jobs:
  server:
    name: Serveur — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.x le plus récent, jamais une version figée : `prisma generate` charge
          # un ESM depuis du CJS, ce qui exige Node >= 22.12 (échoue en 22.9).
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Le client Prisma est généré dans src/generated (non versionné) : sans lui
      # aucun import ne résout. Aucune base n'est nécessaire pour cette étape.
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.x le plus récent, jamais une version figée : `prisma generate` charge
          # un ESM depuis du CJS, ce qui exige Node >= 22.12 (échoue en 22.9).
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # build.production.test.ts relance un vrai `vite build` et grep le résultat :
      # c'est ce qui garantit qu'aucun API interdit (canvas, SVG, MediaPipe) ne
      # revient dans le bundle de production.
      - run: npm test
