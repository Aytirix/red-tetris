services:
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./frontend
      target: dev
      args:
        PORT_DEV_FRONTEND: ${PORT_DEV_FRONTEND}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "0.0.0.0:${PORT_DEV_FRONTEND}:${PORT_DEV_FRONTEND}"
    volumes:
      - ./frontend:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_CACHE: /tmp/.npm
    command: sh -c 'if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port ${PORT_DEV_FRONTEND}'

  frontend-builder:
    profiles: [ "prod" ]
    build:
      context: ./frontend
      target: build
    volumes:
      - frontend_dist:/dist
    command: sh -c "cp -r /app/dist/. /dist/"

  backend-dev:
    profiles: [ "dev" ]
    build:
      context: ./server
      target: dev
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    command: npm run dev

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

volumes:
  frontend_node_modules:
  backend_node_modules:
  frontend_dist:
  db_data:
