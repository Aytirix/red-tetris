services:
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./frontend
      target: dev
      args:
        PORT_DEV_FRONTEND: ${PORT_DEV_FRONTEND:?PORT_DEV_FRONTEND is required}
    ports:
      - "0.0.0.0:${PORT_DEV_FRONTEND:?PORT_DEV_FRONTEND is required}:${PORT_DEV_FRONTEND:?PORT_DEV_FRONTEND is required}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_CACHE: /tmp/.npm
      VITE_PORT: ${PORT:?PORT is required}
    command: sh -c 'if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port ${PORT_DEV_FRONTEND:?PORT_DEV_FRONTEND is required}'

  backend-prod:
    profiles: [ "prod" ]
    restart: unless-stopped
    # Image mono-conteneur (front + back) : voir Dockerfile.prod. Contexte = racine du
    # dépôt pour pouvoir builder à la fois frontend/ et server/.
    build:
      context: .
      dockerfile: Dockerfile.prod
    # Pas de publication de port HÔTE : sur un serveur Coolify partagé, binder un port
    # fixe (3000) collisionne avec les autres stacks. Le reverse proxy de Coolify route
    # le domaine vers ce port INTERNE. `expose` = joignable via le réseau Docker / le
    # proxy uniquement, sans binding hôte.
    expose:
      - "${PORT:?PORT is required}"
    environment:
      HOST: ${HOST:?HOST is required}
      PORT: ${PORT:?PORT is required}
      NODE_ENV: production
      # SPA embarquée dans l'image (COPY --from=frontend), servie par Express.
      STATIC_DIR: /app/frontend-dist
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${PORT}}
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      db:
        condition: service_healthy

  backend-dev:
    profiles: [ "dev" ]
    build:
      context: ./server
      target: dev
    ports:
      - "${PORT:?PORT is required}:${PORT:?PORT is required}"
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    environment:
      HOST: ${HOST:?HOST is required}
      PORT: ${PORT:?PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT_DEV_FRONTEND: ${PORT_DEV_FRONTEND:?PORT_DEV_FRONTEND is required}
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      # Publie uniquement en local: la base n'a pas a etre joignable depuis le LAN,
      # backend-prod l'atteint par le reseau interne de Compose.
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    # Console d'administration de la base: outil de developpement uniquement, elle ne
    # doit jamais etre publiee par le profil prod.
    profiles: [ "dev" ]
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "${PGADMIN_PORT:?PGADMIN_PORT is required}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  frontend_node_modules:
  backend_node_modules:
  db_data:
  pgadmin_data:
