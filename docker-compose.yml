services:
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./frontend
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_CACHE: /tmp/.npm
    command: sh -c 'if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi && npm run dev -- --host 0.0.0.0'

  frontend-prod:
    profiles: [ "prod" ]
    build:
      context: ./frontend
      target: prod
    ports:
      - "0.0.0.0:8080:80"
