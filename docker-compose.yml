services:
  frontend-dev:
    profiles: [ "dev" ]
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0

  frontend-prod:
    profiles: [ "prod" ]
    build:
      context: ./frontend
      target: prod
    ports:
      - "8080:80"

  backend-dev:
    profiles: [ "dev" ]
    build:
      context: ./server
      target: dev
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
    command: npm run dev

volumes:
  frontend_node_modules:
